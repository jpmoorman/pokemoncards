name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons bench.html bench-page.js _site/
          # The big versioned files (card details, text-recognition models and runtime).
          for d in data models vendor; do if [ -d "$d" ]; then cp -r "$d" _site/; fi; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub Pages picks the content types. The text reader's worker imports the runtime
      # (.mjs) as a module, which only works if it comes as JavaScript: otherwise the app
      # falls back to the slower Tesseract reader. Checked on the published site.
      - name: Check the content types of the published files
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module -e "
            const { ASSETS } = await import('./js/assets.js');
            const must = { js: /javascript/, mjs: /javascript/ };
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            let bad = 0;
            for (const p of ['js/ocr-worker.js', ...Object.keys(ASSETS)]) {
              let r = null;
              // A file just published may take a moment to show up.
              for (let i = 0; i < 6; i++) {
                r = await fetch(new URL(p, process.env.BASE), { method: 'HEAD' }).catch(() => null);
                if (r?.ok) break;
                await sleep(10000);
              }
              const type = r?.headers.get('content-type') || '';
              const ok = !!r?.ok && (must[p.split('.').pop()] || /./).test(type);
              console.log(ok ? 'ok ' : 'BAD', p, r?.status, type, r?.headers.get('content-encoding') || '');
              bad += !ok;
            }
            process.exit(bad ? 1 : 0);
          "
